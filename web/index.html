<!doctype html>
<!-- 声明当前文档使用 HTML5 标准解析模式。 -->
<!-- DOCTYPE 是 HTML 文档类型声明；html 指定按 HTML5 标准解释后续页面元素 -->
<!--
  ============================================================================
  文件作用：前端 HTML 入口模板（Vite 的起点）
  所属模块：web/
  ============================================================================

  【宏观定位】整个前端唯一的 HTML 文件。
    开发期：Vite 开发服务器直接返回它，脚本是 ES Module，按需编译。
    生产期：npm run build 后，Vite 把它作为模板生成 dist/index.html，
            并把打包后的 JS/CSS 以 <script>/<link> 注入，
            最终由云端 Nginx 托管（deploy/nginx/cloud.conf 的 root 指向它）。

  【为什么是单页应用（SPA）】
    只有这一个 HTML，所有页面切换靠前端路由（vue-router），
    不重新加载整个文档 —— 所以切换页面时 WebSocket 连接不会断。

  【<html class="dark"> 的作用】
    Element Plus 的暗色主题是靠 html 元素上的 .dark 类激活的
    （配合 element-plus/theme-chalk/dark/css-vars.css）。
    在 HTML 上直接写死，省得 JS 里再切一次，避免首屏闪白。
  ============================================================================
-->
<!-- 这一段负责配置和实现 web/index.html 对应的项目模块，为后续代码提供当前文件的处理入口。 -->
<html lang="zh-CN" class="dark">
<!-- 声明或结束一个 HTML 标签及其属性。 -->
<!-- html 是当前使用的界面元素或组件；class 表示应用的样式类，当前值为 dark -->
  <head>
  <!-- 声明或结束一个 HTML 标签及其属性。 -->
  <!-- head 是当前使用的界面元素或组件 -->
    <!-- 字符编码：中文页面必须声明，否则可能乱码 -->
    <meta charset="UTF-8" />
    <!-- 声明或结束一个 HTML 标签及其属性。 -->
    <!-- meta 是当前使用的界面元素或组件 -->
    <!-- 移动端适配：禁止缩放，保证在工控机触摸屏上正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 声明或结束一个 HTML 标签及其属性。 -->
    <!-- meta 是当前使用的界面元素或组件；content 表示提示弹层展示的正文，当前值为 width=device-width, initial-scale=1… -->
    <!-- 浏览器标签页标题 -->
    <title>产线数字孪生监控平台</title>
    <!-- 声明或结束一个 HTML 标签及其属性。 -->
    <!-- title 是当前使用的界面元素或组件 -->
  </head>
  <!-- 声明或结束一个 HTML 标签及其属性。 -->
  <!-- head 是当前使用的界面元素或组件 -->
  <body>
  <!-- 声明或结束一个 HTML 标签及其属性。 -->
  <!-- body 是当前使用的界面元素或组件 -->
    <!-- Vue 应用的挂载点：createApp(App).mount('#app') 会接管这个 div -->
    <div id="app"></div>
    <!-- 声明或结束一个 HTML 标签及其属性。 -->
    <!-- div 是当前使用的界面元素或组件 -->
    <!-- 入口脚本：type="module" 表示 ES Module（Vite 会接管并转换） -->
    <script type="module" src="/src/main.ts"></script>
    <!-- 声明或结束一个 HTML 标签及其属性。 -->
    <!-- script 是当前使用的界面元素或组件；type 表示组件外观类型或输入控件类型，当前值为 module -->
  </body>
  <!-- 声明或结束一个 HTML 标签及其属性。 -->
  <!-- body 是当前使用的界面元素或组件 -->
</html>
<!-- 声明或结束一个 HTML 标签及其属性。 -->
<!-- html 是当前使用的界面元素或组件 -->
<!-- 这一段提供了配置和实现 web/index.html 对应的项目模块所需的定义和处理逻辑，结果交由调用方或运行环境使用。 -->
