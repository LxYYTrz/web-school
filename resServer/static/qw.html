<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对话</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e6e8eb;
    --user-bubble: #4f7cff;
    --user-text: #ffffff;
    --ai-bubble: #ffffff;
    --ai-text: #1f2329;
    --muted: #8a9099;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ai-text);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 整体布局 ============ */
  .app {
    width: 100%;
    max-width: 860px;
    height: 100vh;
    height: 100dvh;           /* 移动端地址栏兼容 */
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: var(--shadow);
  }

  /* ============ 顶部标题栏 ============ */
  .header {
    flex: 0 0 auto;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
  }

  .header .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #34c759;
    box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.15);
  }

  .header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.3px;
  }

  .header .sub {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }

  .btn-clear {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-clear:hover {
    color: #e5484d;
    border-color: #ffd0d2;
    background: #fff5f5;
  }

  /* ============ 消息滚动区 ============ */
  .messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 20px 8px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb {
    background: #d8dbe0;
    border-radius: 4px;
  }
  .messages::-webkit-scrollbar-thumb:hover { background: #c2c6cc; }
  .messages::-webkit-scrollbar-track { background: transparent; }

  /* ============ 单条消息 ============ */
  .row {
    display: flex;
    margin-bottom: 18px;
    gap: 10px;
    animation: fadeIn .22s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .row.user { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    user-select: none;
  }
  .row.ai   .avatar { background: linear-gradient(135deg, #7b61ff, #4f7cff); }
  .row.user .avatar { background: linear-gradient(135deg, #34c759, #1fae4a); }

  .bubble {
    max-width: 74%;
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .row.ai .bubble {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-top-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(79, 124, 255, 0.25);
  }

  /* ============ 打字光标 ============ */
  .cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    margin-left: 2px;
    vertical-align: -2px;
    background: #4f7cff;
    animation: blink .9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ 三个点 loading ============ */
  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 18px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b9bec7;
    animation: bounce 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30%           { transform: translateY(-5px); opacity: 1; }
  }

  /* ============ 错误提示 ============ */
  .row.error .bubble {
    background: #fff5f5;
    color: #c92a2a;
    border: 1px solid #ffd0d2;
  }

  /* ============ 欢迎语 ============ */
  .welcome {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 20px;
    line-height: 1.9;
  }
  .welcome .big {
    font-size: 20px;
    color: #3a3f47;
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* ============ 底部输入区 ============ */
  .composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: #fff;
    padding: 12px 16px 14px;
  }

  .composer-inner {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: #f7f8fa;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 8px 8px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer-inner:focus-within {
    border-color: #b6c8ff;
    box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.1);
    background: #fff;
  }

  #input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    resize: none;
    font-size: 15px;
    line-height: 1.6;
    font-family: inherit;
    color: var(--ai-text);
    max-height: 160px;
    min-height: 24px;
    padding: 4px 0;
  }
  #input::placeholder { color: #a8aeb8; }

  #send {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--user-bubble);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
  }
  #send:hover:not(:disabled) { background: #3f6ae8; }
  #send:active:not(:disabled) { transform: scale(.94); }
  #send:disabled {
    background: #d3d7de;
    cursor: not-allowed;
  }

  .hint {
    text-align: center;
    font-size: 11px;
    color: #b0b6bf;
    margin-top: 8px;
    user-select: none;
  }

  /* ============ 移动端 ============ */
  @media (max-width: 600px) {
    .app { max-width: 100%; }
    .messages { padding: 16px 12px 8px; }
    .bubble { max-width: 82%; font-size: 14.5px; }
    .header { padding: 12px 14px; }
    .composer { padding: 10px 12px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 顶部 -->
  <div class="header">
    <div class="dot"></div>
    <h1>AI 助手</h1>
    <span class="sub" id="status">在线</span>
    <button class="btn-clear" id="clearBtn" title="清空对话">清空</button>
  </div>

  <!-- 消息区 -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="big">👋 你好</div>
      <div>有什么可以帮你的？下面输入消息开始对话吧</div>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
      <button id="send" title="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="hint">AI 生成内容仅供参考</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= 配置 ================= */
  // 后端接口地址（5001 端口）
  const API_BASE = "http://10.144.11.142:5001";
  const CHAT_ENDPOINT = API_BASE + "/chat";

  // 可选：默认模型、温度
  const DEFAULT_MODEL = "qwen3.8-max";
  const DEFAULT_TEMPERATURE = 0.7;

  // 系统提示词（不需要就设为 ""）
  const SYSTEM_PROMPT = "";

  // 保留多少轮历史（user + assistant 算两轮）
  const MAX_HISTORY = 20;

  /* ================= DOM ================= */
  const messagesEl = document.getElementById("messages");
  const welcomeEl  = document.getElementById("welcome");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("send");
  const clearBtn   = document.getElementById("clearBtn");
  const statusEl   = document.getElementById("status");

  /* ================= 状态 ================= */
  let history = [];        // [{role:"user"|"assistant", content:"..."}]
  let sending = false;

  /* ================= 工具函数 ================= */
  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideWelcome() {
    if (welcomeEl && welcomeEl.parentNode) {
      welcomeEl.parentNode.removeChild(welcomeEl);
    }
  }

  /**
   * 追加一条消息
   * @param {"user"|"ai"|"error"} role
   * @param {string} text
   * @returns {HTMLElement} bubble 元素，便于后续更新内容
   */
  function appendMessage(role, text) {
    hideWelcome();

    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "ai")
                          + (role === "error" ? " error" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "我" : (role === "error" ? "!" : "AI");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (text) bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();

    return bubble;
  }

  /** 显示"正在输入"气泡，返回该气泡元素 */
  function appendTyping() {
    const bubble = appendMessage("ai", "");
    bubble.innerHTML =
      '<span class="typing"><span></span><span></span><span></span></span>';
    return bubble;
  }

  function setStatus(text, color) {
    statusEl.textContent = text;
    statusEl.style.color = color || "";
  }

  function setSending(v) {
    sending = v;
    sendBtn.disabled = v;
    inputEl.disabled = v;
  }

  /** 自适应输入框高度 */
  function autoResize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }

  /* ================= 核心：发送消息 ================= */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sending) return;

    // 1. 显示用户消息
    appendMessage("user", text);
    inputEl.value = "";
    autoResize();

    // 2. 写入历史
    history.push({ role: "user", content: text });

    // 3. 构造请求 messages（system 可选 + 历史裁剪）
    const messages = [];
    if (SYSTEM_PROMPT) {
      messages.push({ role: "system", content: SYSTEM_PROMPT });
    }
    const trimmed = history.slice(-MAX_HISTORY);
    messages.push.apply(messages, trimmed);

    // 4. 显示 loading
    setSending(true);
    setStatus("思考中…", "#f0a020");
    const typingBubble = appendTyping();

    try {
      const resp = await fetch(CHAT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: messages,
          model: DEFAULT_MODEL,
          temperature: DEFAULT_TEMPERATURE
        })
      });

      // 尝试解析 JSON（即使状态码非 2xx）
      let data = null;
      try { data = await resp.json(); } catch (e) { /* ignore */ }

      if (!resp.ok) {
        const msg = (data && (data.error || data.message))
                    || ("请求失败 HTTP " + resp.status);
        throw new Error(msg);
      }

      const answer = (data && (data.text || data.content)) || "";
      if (!answer) throw new Error("接口返回内容为空");

      // 5. 用真实内容替换 loading
      typingBubble.textContent = answer;
      scrollToBottom();

      // 6. 写入历史
      history.push({ role: "assistant", content: answer });

      setStatus("在线", "");
    } catch (err) {
      console.error("[chat error]", err);
      typingBubble.parentNode.classList.add("error");
      typingBubble.textContent = "出错了：" + (err.message || "未知错误");

      // 失败时把这条用户消息从历史中弹出，避免污染后续上下文
      history.pop();

      setStatus("异常", "#e5484d");
    } finally {
      setSending(false);
      inputEl.focus();
      scrollToBottom();
    }
  }

  /* ================= 事件绑定 ================= */
  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("input", autoResize);

  inputEl.addEventListener("keydown", function (e) {
    // Enter 发送，Shift + Enter 换行；输入法组合中不触发
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  clearBtn.addEventListener("click", function () {
    if (history.length === 0 && !messagesEl.querySelector(".row")) return;
    if (!confirm("确定清空当前对话？")) return;

    history = [];
    messagesEl.innerHTML = "";

    const w = document.createElement("div");
    w.className = "welcome";
    w.id = "welcome";
    w.innerHTML = '<div class="big">👋 你好</div>' +
                  '<div>有什么可以帮你的？下面输入消息开始对话吧</div>';
    messagesEl.appendChild(w);

    setStatus("在线", "");
    inputEl.focus();
  });

  /* ================= 初始化 ================= */
  inputEl.focus();
  autoResize();
})();
</script>
</body>
</html>
