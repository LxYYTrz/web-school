# ============================================================================
# 文件作用：云服务器侧编排（Nginx 静态前端 + 纯转发）
# 所属模块：deploy/
#
# 【用途】
#   云服务器（Linux，低配）上跑的这一套：
#     docker compose -f deploy/docker-compose.cloud.yml up -d
#
# 【★ 云服务器的职责边界（2026-10-23 收敛，数据库已移回工控机本地）】★★
#   云服务器现在**只做两件事**：
#     ① 托管前端静态文件（dist/）—— 浏览器从这里拿 HTML/JS/CSS
#     ② 纯转发 /api 和 /socket.io 到工控机（经 SSH 反向隧道）
#   ★ **云服务器上不跑后端，不跑采集器，不存数据库，不做任何业务计算**。
#     原因：产线数据处理必须和产线在一起（断网也能工作），
#           低配云服务器扛不住 10Hz 的数据流，历史数据量也大。
#   ★ 2026-10-23 之前数据库曾放在云端（容器 lt-cloud-db），
#     现在**数据库一律在工控机本地**（PostgreSQL 16 + TimescaleDB），
#     云端连隧道都不再挂数据库转发。
#
# 【完整访问路径（浏览器 → 数据的往返）】
#   上行实时：
#     设备 →采集器 →(本机 MQTT)→ 工控机后端 →(SSH 反向隧道)→ 云 Nginx
#            →(WebSocket 长连接)→ 浏览器
#   下行指令：
#     浏览器 → 云 Nginx →(SSH 反向隧道)→ 工控机后端 →(本机 MQTT)→ 采集器 → PLC
#   历史查询：
#     浏览器 → 云 Nginx →(SSH 反向隧道)→ 工控机后端 → 工控机本地 PostgreSQL
#
# 【★ 为什么 Redis 和 PostgreSQL 都在工控机】
#   Redis：只存"当前状态"，要求低延迟、断网可用 → 工控机本机
#   PostgreSQL：历史数据 + 业务表 → 工控机本机（数据跟着产线走，断网照常落库）
#
# 【端口安全】
#   8081 ：Nginx HTTP（浏览器入口；容器内是 80，这台机器的 80 被 DSH caddy 占着）
#   443  ：Nginx HTTPS（上生产时打开，证书挂载见 nginx/cloud.conf）
#   ★ 云端**不再有数据库端口**，不需要在安全组放行 5432。
# ============================================================================

# =============================================================
# 云服务器(低配 Linux)侧基础设施
# 角色:静态前端托管 + 纯转发(零业务逻辑)
#
# 用法:docker compose -f deploy/docker-compose.cloud.yml up -d
#
# ★ 安全要点:
#   1. 云端只暴露 80/443/22;SSH 隧道入口 3300 只绑回环,不对公网开放
#   2. 上 HTTPS 时,在 nginx/certs/ 放证书,取消 compose 里 443 的注释
# =============================================================
services:
  # --------------------------------------------------------------------------
  # Nginx：云服务器的"门面"
  #   两个职责：
  #     ① 托管前端静态文件（SPA，含 try_files 回退）
  #     ② 把 /api 和 /socket.io 反代到同一入口（带 WebSocket 升级头）
  #   配置文件：deploy/nginx/cloud.conf
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: lt-cloud-nginx
    restart: unless-stopped
    ports:
      # HTTP(浏览器唯一需要访问的端口)。
      # ★ 这台云服务器的 80 被 DSH caddy 占着,所以对外用 8081,容器内仍是 80。
      #   换到 80 空闲的机器时可以改成 "80:80"。
      - "8081:80"
      # - "443:443"   # 上 HTTPS 时打开,并把证书挂进 nginx/certs
    volumes:
      # Nginx 站点配置（只读挂载）
      - ./nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物(web/ 执行 npm run build 后,把 dist/ 拷到这里)
      - ./dist:/usr/share/nginx/html:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
