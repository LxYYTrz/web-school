# ============================================================================
# 文件作用：云服务器侧编排（Nginx 静态前端 + 纯转发 + PostgreSQL）
# 所属模块：deploy/
# ============================================================================
#
# 【用途】
#   云服务器（Linux，低配）上跑的这一套：
#     docker compose -f deploy/docker-compose.cloud.yml up -d
#
# 【★ 云服务器的职责边界（部署定稿，非常重要）】
#   云服务器只做三件事：
#     ① 托管前端静态文件（dist/）—— 浏览器从这里拿 HTML/JS/CSS
#     ② 存放数据库（PostgreSQL/TimescaleDB）
#     ③ 纯转发 /api 和 /socket.io 到工控机（经 SSH 反向隧道）
#   ★ **云服务器上不跑后端，不跑采集器，不做任何业务计算**。
#     原因：产线数据处理必须和产线在一起（断网也能工作），
#           而且低配云服务器扛不住 10Hz 的数据流。
#
# 【完整访问路径（浏览器 → 数据的往返）】
#   上行实时：
#     设备 →采集器 →(本机 MQTT)→ 工控机后端 →(SSH 反向隧道)→ 云 Nginx
#            →(WebSocket 长连接)→ 浏览器
#   下行指令：
#     浏览器 → 云 Nginx →(SSH 反向隧道)→ 工控机后端 →(本机 MQTT)→ 采集器 → PLC
#   历史查询：
#     浏览器 → 云 Nginx → 工控机后端 →(SSH 正向隧道)→ 云端 PostgreSQL
#
# 【★ 为什么数据库在云端，而 Redis 在工控机】
#   PostgreSQL：历史数据量大、要长期保存、要给分析员查曲线 → 放云端（可备份、可扩容）
#   Redis：只存"当前状态"，要求低延迟、断网可用 → 放工控机本机
#
# 【端口安全】
#   80  ：Nginx HTTP（浏览器入口）
#   443 ：Nginx HTTPS（上生产时打开，证书挂载见 nginx/cloud.conf）
#   5432：PostgreSQL，**只绑 127.0.0.1** —— 只有本机和 SSH 隧道进来的工控机能连
#
# 【前端 dist 从哪来】
#   在开发机执行 cd web && npm run build，生成 web/dist/，
#   然后把 dist/ 拷到云服务器的 line-twin/deploy/dist/（compose 里挂载为 Nginx 的 root）。
# ============================================================================

# =============================================================
# 云服务器(低配 Linux)侧基础设施
# 角色:静态前端托管 + PostgreSQL 数据库 + 纯转发(零业务逻辑)
#
# 用法:docker compose -f deploy/docker-compose.cloud.yml up -d
#
# ★ 安全要点:
#   1. PostgreSQL 只监听 127.0.0.1,工控机经 SSH 隧道访问,不对公网开放
#   2. 在 deploy/.env 里设置 POSTGRES_PASSWORD(强随机)
#   3. 443/80 由 Nginx 暴露;如果上 HTTPS,证书挂到 Nginx(见 nginx/cloud.conf)
# =============================================================
services:
  # --------------------------------------------------------------------------
  # Nginx：云服务器的"门面"
  #   三个职责：
  #     ① 托管前端静态文件（SPA，含 try_files 回退）
  #     ② 把 /api 反代到 SSH 隧道入口（127.0.0.1:3300）
  #     ③ 把 /socket.io 反代到同一入口（带 WebSocket 升级头）
  #   配置文件：deploy/nginx/cloud.conf
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: lt-cloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"                # HTTP（浏览器唯一需要访问的端口）
      # - "443:443"   # 上 HTTPS 时打开,并把证书挂进 /etc/nginx/certs
    volumes:
      # Nginx 站点配置（只读挂载）
      - ./nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物(web/ 执行 npm run build 后,把 dist/ 拷到这里)
      - ./dist:/usr/share/nginx/html:ro
      # - ./nginx/certs:/etc/nginx/certs:ro

  # --------------------------------------------------------------------------
  # TimescaleDB：云端数据库
  #   历史时序数据（机器人帧/状态/事件）+ 业务表（产线/设备/用户/指令审计）
  #   ★ 只绑回环口：只有本机（以及 SSH 隧道进来的工控机）能连
  # --------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lt-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # ${POSTGRES_PASSWORD:?...} —— Compose 的变量插值语法：
      #   如果环境变量没设置，就直接报错退出（而不是用一个空密码启动）。
      #   密码放在 deploy/.env 文件里（该文件不入 Git）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: linetwin
    ports:
      # 只绑定回环口:只有本机(以及 SSH 隧道进来的工控机)能连
      - "127.0.0.1:5432:5432"
    volumes:
      # 数据库数据目录
      - pg-data:/var/lib/postgresql/data
      # 首次启动自动执行 DDL（建表 + 种子数据）
      - ../db/init:/docker-entrypoint-initdb.d:ro

# 具名卷声明
volumes:
  # PostgreSQL 数据目录（★ 记得定期备份，见 docs/deployment.md）
  pg-data:
