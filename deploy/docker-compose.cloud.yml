# =============================================================
# 云服务器(低配 Linux)侧基础设施
# 角色:静态前端托管 + PostgreSQL 数据库 + 纯转发(零业务逻辑)
#
# 用法:docker compose -f deploy/docker-compose.cloud.yml up -d
#
# ★ 安全要点:
#   1. PostgreSQL 只监听 127.0.0.1,工控机经 SSH 隧道访问,不对公网开放
#   2. 改 POSTGRES_PASSWORD
#   3. 443/80 由 Nginx 暴露;如果上 HTTPS,证书挂到 Nginx(见 nginx/cloud.conf)
# =============================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lt-cloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # 上 HTTPS 时打开,并把证书挂进 /etc/nginx/certs
    volumes:
      - ./nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物(web/ 执行 npm run build 后,把 dist/ 拷到这里)
      - ./dist:/usr/share/nginx/html:ro
      # - ./nginx/certs:/etc/nginx/certs:ro

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lt-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123               # ★ 必须修改
      POSTGRES_DB: linetwin
    ports:
      # 只绑定回环口:只有本机(以及 SSH 隧道进来的工控机)能连
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pg-data:
