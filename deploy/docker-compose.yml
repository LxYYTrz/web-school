# =============================================================
# 产线数字孪生平台 - 基础设施(本地开发 / 云服务器通用)
# 组件: EMQX(MQTT) + TimescaleDB(PG16) + Redis
#
# ★ 生产部署前必须:
#   1. 修改下列所有默认密码
#   2. 为 8883 配置 TLS 证书(EMQX 侧)
#   3. EMQX 关闭匿名登录(EMQX_ALLOW_ANONYMOUS=false)并配置认证
#   4. 云服务器安全组只对公网开 443 / 8883;
#      18083(EMQX Dashboard)、5432、6379 一律不对公网
# =============================================================
# 产线数字孪生平台 - 基础设施(本地开发 / 云服务器通用)
# 组件: EMQX(MQTT) + TimescaleDB(PG16) + Redis
# ★ 生产部署前必须:
#   1. 修改下列所有默认密码
#   2. 为 8883 配置 TLS 证书(EMQX 侧)
#   3. EMQX 关闭匿名登录(EMQX_ALLOW_ANONYMOUS=false)并配置认证
#   4. 云服务器安全组只对公网开 443 / 8883;
#      18083(EMQX Dashboard)、5432、6379 一律不对公网
services:
  # --------------------------------------------------------------------------
  # EMQX：MQTT Broker（消息代理）
  # 角色：产线数据的所有 MQTT 报文在这里汇聚和分发。
  #       采集器 publish → Broker → 后端 subscribe，同一份数据也可能被多个订阅者收到。
  emqx:
    image: emqx/emqx:5.8
    container_name: lt-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT TCP(生产环境建议仅内网,对外只暴露 8883)
      - "8883:8883"    # MQTT over TLS(边缘采集器走这里)
      - "18083:18083"  # Dashboard(★不要对公网开放)
      - "8083:8083"    # MQTT over WebSocket(备用)
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123   # TODO 生产修改
      EMQX_ALLOW_ANONYMOUS: "true"                  # TODO 生产改 false
    # ============================================================================
    # 具名卷声明（必须在顶层 volumes 里声明，才能被上面的 services 引用）
    volumes:
      # 数据持久化（会话、规则、配置）
      - emqx-data:/opt/emqx/data

  # --------------------------------------------------------------------------
  # TimescaleDB：PostgreSQL 16 + 时序扩展
  # 角色：存放历史时序数据（机器人帧/状态/事件）+ 业务表（产线/设备/用户/审计）。
  #       TimescaleDB 把大表按时间自动分区，10Hz 写入也能扛住。
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123               # TODO 生产修改
      POSTGRES_DB: linetwin
    ports:
      - "5432:5432"                                # 生产不要对公网开放
    volumes:
      # 数据库数据目录（最重要，删了这个卷数据就没了）
      - pg-data:/var/lib/postgresql/data
      # 首次启动自动执行建表 DDL(仅空库初始化时执行一次)
      - ../db/init:/docker-entrypoint-initdb.d:ro

  # --------------------------------------------------------------------------
  # Redis：实时快照缓存
  # 角色：存"每台设备的最新一帧"，供前端首屏和断线重连时读取。
  #       写 Redis 是"覆盖写 + TTL"，不存历史。
  redis:
    image: redis:7-alpine
    container_name: lt-redis
    restart: unless-stopped
    # 开启 AOF 持久化（appendonly yes）：每次写入都追加到文件，重启不丢数据
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"                                # 生产不要对公网开放
    volumes:
      - redis-data:/data

volumes:
  # EMQX 数据（配置、规则、会话）
  emqx-data:
  # PostgreSQL 数据目录
  pg-data:
  # Redis AOF 文件
  redis-data:
