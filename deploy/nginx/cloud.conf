# 原生 Nginx:静态前端 + 经本机 SSH 反向隧道转发到工控机后端。
# 前端构建产物放在 /opt/line-twin/deploy/dist/。
# 工控机建立: ssh -N -R 127.0.0.1:3300:127.0.0.1:3000 user@cloud

upstream ipc_backend {
    server 127.0.0.1:3300;
    keepalive 16;
}

server {
    listen 8081;
    server_name _;

    root /opt/line-twin/deploy/dist;
    index index.html;
    server_tokens off;

    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 机器令牌通道只供工控机本机调用，不经公网代理。
    location ^~ /api/machine/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://ipc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://ipc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
