# 云服务器 Nginx:静态前端 + 纯转发(/api 与 /socket.io 经 SSH 隧道到工控机)
#
# 数据路径:
#   浏览器 https://云服务器/           → 本 conf 的静态 dist/
#   浏览器 https://云服务器/api/...    → 127.0.0.1:3300(SSH 反向隧道)→ 工控机 NestJS
#   浏览器 https://云服务器/socket.io/ → 127.0.0.1:3300(同上,WebSocket 升级)
#
# 隧道由工控机主动建立(见 docs/deployment.md):
#   ssh -N -R 3300:127.0.0.1:3000 -L 5432:127.0.0.1:5432 user@云服务器

upstream ipc_backend {
    server 127.0.0.1:3300;        # SSH 反向隧道的云端入口
    keepalive 16;
}

server {
    listen 80;
    server_name _;                # 有域名后改为实际域名

    root /usr/share/nginx/html;   # 前端 dist(由 compose 挂载)
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → 工控机后端
    location /api/ {
        proxy_pass http://ipc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WebSocket(socket.io)→ 工控机后端;必须带升级头,长连接超时放宽
    location /socket.io/ {
        proxy_pass http://ipc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTPS 时:listen 443 ssl + 证书,并把 80 跳转 443
}
