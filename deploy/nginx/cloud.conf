# 原生 Nginx:静态前端 + 经本机 SSH 反向隧道转发到工控机后端。
# 前端构建产物放在 /opt/line-twin/deploy/dist/。
# 工控机建立: ssh -N -R 127.0.0.1:3300:127.0.0.1:3000 user@cloud

# 这一段负责配置云端静态页面、API 与 WebSocket 反向代理，为后续代码提供当前文件的处理入口。

# ipc_backend 命名的是 Nginx 的后端上游，本配置将它指向云服务器自己的 127.0.0.1:3300。
# 这个端口由工控机主动建立 SSH 反向转发后在云端监听；3300 不是 NestJS 在云端运行的端口。
# 工控机侧目标后端是本机 3000，两台机器的 127.0.0.1 分别表示各自本机。

upstream ipc_backend {
# 打开 upstream 配置块。
# upstream 是当前配置格式中的指令或字段名称

    # Nginx 连接这一上游时，是云端 Nginx 到云端 sshd 转发监听的本机 TCP 连接。
    # sshd 将字节放进已建立的 SSH 通道，工控机 ssh 再交给本机 NestJS；请求和响应都可以沿通道传递。

    server 127.0.0.1:3300;
    # 设置 Nginx 指令 server。
    # server 是当前配置格式中的指令或字段名称
    keepalive 16;
    # 设置 Nginx 指令 keepalive。
    # keepalive 是当前配置格式中的指令或字段名称
}
# 结束当前函数、分支或对象配置，返回上一层处理流程。
# 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

server {
# 打开 server 配置块，供当前处理流程继续使用。
# server 是当前配置格式中的指令或字段名称

    # 本 server 监听 HTTP 8081，并用 root 目录提供构建后的网页文件；网页 JavaScript 随后在访问者浏览器执行。
    # 业务请求由下面的 /api/ 与 /socket.io/ 规则转给后端。网页文件能打开，不能单独证明现场数据或实时连接正常。

    listen 8081;
    # 设置 Nginx 指令 listen。
    # listen 是当前配置格式中的指令或字段名称
    server_name _;
    # 设置 Nginx 指令 server_name。
    # server_name 是当前配置格式中的指令或字段名称

    root /opt/line-twin/deploy/dist;
    # 设置 Nginx 指令 root。
    # root 是当前配置格式中的指令或字段名称
    index index.html;
    # 设置 Nginx 指令 index。
    # index 是当前配置格式中的指令或字段名称
    server_tokens off;
    # 设置 Nginx 指令 server_tokens。
    # server_tokens 是当前配置格式中的指令或字段名称

    location /assets/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        try_files $uri =404;
        # 设置 Nginx 指令 try_files。
        # try_files 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    location ~ /\. {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        deny all;
        # 设置 Nginx 指令 deny。
        # deny 是当前配置格式中的指令或字段名称
        access_log off;
        # 设置 Nginx 指令 access_log。
        # access_log 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    location / {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        try_files $uri $uri/ /index.html;
        # 设置 Nginx 指令 try_files。
        # try_files 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    # 机器令牌通道只供工控机本机调用，不经公网代理。
    location ^~ /api/machine/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        return 403;
        # 设置 Nginx 指令 return。
        # return 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    # 浏览器发来的 /api/ 请求转发到 ipc_backend，即云端本机 3300，再经 SSH 到工控机后端。
    # Nginx 搬运 HTTP 请求与响应，登录校验、Redis 读取和控制检查由 NestJS 对应接口执行。
    # 上方更具体的 /api/machine/ 规则单独拒绝公网机器通道请求，不能把普通 API 转发理解成所有路径都同样开放。

    location /api/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        proxy_pass http://ipc_backend;
        # 设置 Nginx 指令 proxy_pass。
        # proxy_pass 是当前配置格式中的指令或字段名称
        proxy_set_header Host $host;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Real-IP $remote_addr;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Forwarded-Proto $scheme;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_read_timeout 30s;
        # 设置 Nginx 指令 proxy_read_timeout。
        # proxy_read_timeout 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    # 实时连接同样转给 ipc_backend，并保留 HTTP/1.1 与 WebSocket 升级请求头。
    # 连接到后端后，网页仍需发 subscribe 加入产线房间，随后才能接收对应 robot_state 等事件。
    # 这段代理不负责业务房间订阅，也不会因 API 快照成功就保证实时新帧持续到达。

    location /socket.io/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        proxy_pass http://ipc_backend;
        # 设置 Nginx 指令 proxy_pass。
        # proxy_pass 是当前配置格式中的指令或字段名称
        proxy_http_version 1.1;
        # 设置 Nginx 指令 proxy_http_version。
        # proxy_http_version 是当前配置格式中的指令或字段名称
        proxy_set_header Upgrade $http_upgrade;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header Connection "upgrade";
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header Host $host;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_read_timeout 3600s;
        # 设置 Nginx 指令 proxy_read_timeout。
        # proxy_read_timeout 是当前配置格式中的指令或字段名称
        proxy_send_timeout 3600s;
        # 设置 Nginx 指令 proxy_send_timeout。
        # proxy_send_timeout 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境
}
# 结束当前函数、分支或对象配置，返回上一层处理流程。
# 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境
# 这一段提供了配置云端静态页面、API 与 WebSocket 反向代理所需的定义和处理逻辑，结果交由调用方或运行环境使用。
