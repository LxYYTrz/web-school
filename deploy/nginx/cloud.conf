# ============================================================================
# 文件作用：云服务器 Nginx 站点配置（静态前端 + 纯转发）
# 所属模块：deploy/nginx/
# ============================================================================
#
# ============================================================================
# ★ 本文件回答"浏览器是怎么访问到工控机上的后端的" ★
# ============================================================================
#
# 【数据路径总览】
#   浏览器 https://云服务器/           → 本 conf 的静态 dist/
#   浏览器 https://云服务器/api/...    → 127.0.0.1:3300(SSH 反向隧道)→ 工控机 NestJS
#   浏览器 https://云服务器/socket.io/ → 127.0.0.1:3300(同上,WebSocket 升级)
#
# 【★ 隧道由工控机主动建立（见 docs/deployment.md）】
#   ssh -N -R 3300:127.0.0.1:3000 -L 5432:127.0.0.1:5432 user@云服务器
#     -R 3300:127.0.0.1:3000  云服务器的 3300 端口 → 工控机的后端 3000 端口
#                              （这就是下面 upstream 指向 127.0.0.1:3300 的原因）
#     -L 5432:127.0.0.1:5432  工控机访问本地 5432 → 云服务器的数据库
#
# 【为什么这样设计（而不是云服务器直连工控机）】
#   ① 工厂防火墙通常不允许入站开口子 —— 工控机主动外连，零配置。
#   ② 云服务器只需要暴露 80/443，攻击面最小。
#   ③ 隧道断 = 网站不可访问，这是本架构唯一的单点，必须做保活 + 监控。
#
# 【Nginx 的三个 location 段】
#   /           静态前端（SPA 回退到 index.html）
#   /api/       REST 反代
#   /socket.io/ WebSocket 反代（必须带 Upgrade 头 + 放宽超时）
# ============================================================================

# ---------------------------------------------------------------------------
# upstream：定义后端上游
#   Nginx 会把请求轮询/复用发到这里的 server 127.0.0.1:3300。
#   keepalive 16 = 与上游保持 16 条长连接，减少 TCP 握手开销。
# ---------------------------------------------------------------------------
upstream ipc_backend {
    server 127.0.0.1:3300;        # SSH 反向隧道的云端入口
    keepalive 16;
}

# ---------------------------------------------------------------------------
# server 块：一个虚拟主机
# ---------------------------------------------------------------------------
server {
    listen 80;                   # 监听 HTTP 80（生产上 HTTPS 后应跳转到 443）
    server_name _;                # 有域名后改为实际域名；_ 表示匹配任意 Host

    root /usr/share/nginx/html;   # 前端 dist(由 compose 挂载)
    index index.html;

    # ---- SPA 路由回退 ----
    # 用户访问 /status（前端路由）时，磁盘上并没有 status 这个文件。
    # try_files 依次尝试：
    #   $uri      → /usr/share/nginx/html/status（不存在）
    #   $uri/     → /usr/share/nginx/html/status/（不存在）
    #   /index.html → 存在 → 返回前端应用，由 vue-router 解析路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- REST API → 工控机后端 ----
    location /api/ {
        proxy_pass http://ipc_backend;   # 转发到 upstream
        # 把真实客户端 IP 传给后端（后端做审计要用）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端处理超时的兜底
        proxy_read_timeout 30s;
    }

    # ---- WebSocket(socket.io)→ 工控机后端;必须带升级头,长连接超时放宽 ----
    location /socket.io/ {
        proxy_pass http://ipc_backend;
        # ★ HTTP/1.1 + Upgrade 头 = 把普通 HTTP 请求升级成 WebSocket 长连接。
        #   少了这两行，socket.io 会一直重连失败（页面无实时数据）。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ★ 超时必须放宽到 1 小时：默认 60s 会导致长连接被周期性断开、
        #   前端不断重连（表现为"数据偶尔卡一下"）。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTPS 时:listen 443 ssl + 证书,并把 80 跳转 443
}
