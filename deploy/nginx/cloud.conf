# 原生 Nginx:静态前端 + 经本机 SSH 反向隧道转发到工控机后端。
# 前端构建产物放在 /opt/line-twin/deploy/dist/。
# 工控机建立: ssh -N -R 127.0.0.1:3300:127.0.0.1:3000 user@cloud

# 这一段负责配置云端静态页面、API 与 WebSocket 反向代理，为后续代码提供当前文件的处理入口。
upstream ipc_backend {
# 打开 upstream 配置块。
# upstream 是当前配置格式中的指令或字段名称
    server 127.0.0.1:3300;
    # 设置 Nginx 指令 server。
    # server 是当前配置格式中的指令或字段名称
    keepalive 16;
    # 设置 Nginx 指令 keepalive。
    # keepalive 是当前配置格式中的指令或字段名称
}
# 结束当前函数、分支或对象配置，返回上一层处理流程。
# 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

server {
# 打开 server 配置块，供当前处理流程继续使用。
# server 是当前配置格式中的指令或字段名称
    listen 8081;
    # 设置 Nginx 指令 listen。
    # listen 是当前配置格式中的指令或字段名称
    server_name _;
    # 设置 Nginx 指令 server_name。
    # server_name 是当前配置格式中的指令或字段名称

    root /opt/line-twin/deploy/dist;
    # 设置 Nginx 指令 root。
    # root 是当前配置格式中的指令或字段名称
    index index.html;
    # 设置 Nginx 指令 index。
    # index 是当前配置格式中的指令或字段名称
    server_tokens off;
    # 设置 Nginx 指令 server_tokens。
    # server_tokens 是当前配置格式中的指令或字段名称

    location /assets/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        try_files $uri =404;
        # 设置 Nginx 指令 try_files。
        # try_files 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    location ~ /\. {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        deny all;
        # 设置 Nginx 指令 deny。
        # deny 是当前配置格式中的指令或字段名称
        access_log off;
        # 设置 Nginx 指令 access_log。
        # access_log 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    location / {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        try_files $uri $uri/ /index.html;
        # 设置 Nginx 指令 try_files。
        # try_files 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    # 机器令牌通道只供工控机本机调用，不经公网代理。
    location ^~ /api/machine/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        return 403;
        # 设置 Nginx 指令 return。
        # return 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    location /api/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        proxy_pass http://ipc_backend;
        # 设置 Nginx 指令 proxy_pass。
        # proxy_pass 是当前配置格式中的指令或字段名称
        proxy_set_header Host $host;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Real-IP $remote_addr;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Forwarded-Proto $scheme;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_read_timeout 30s;
        # 设置 Nginx 指令 proxy_read_timeout。
        # proxy_read_timeout 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境

    location /socket.io/ {
    # 打开 location 配置块。
    # location 是当前配置格式中的指令或字段名称
        proxy_pass http://ipc_backend;
        # 设置 Nginx 指令 proxy_pass。
        # proxy_pass 是当前配置格式中的指令或字段名称
        proxy_http_version 1.1;
        # 设置 Nginx 指令 proxy_http_version。
        # proxy_http_version 是当前配置格式中的指令或字段名称
        proxy_set_header Upgrade $http_upgrade;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header Connection "upgrade";
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header Host $host;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置 Nginx 指令 proxy_set_header。
        # proxy_set_header 是当前配置格式中的指令或字段名称
        proxy_read_timeout 3600s;
        # 设置 Nginx 指令 proxy_read_timeout。
        # proxy_read_timeout 是当前配置格式中的指令或字段名称
        proxy_send_timeout 3600s;
        # 设置 Nginx 指令 proxy_send_timeout。
        # proxy_send_timeout 是当前配置格式中的指令或字段名称
    }
    # 结束当前函数、分支或对象配置，返回上一层处理流程。
    # 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境
}
# 结束当前函数、分支或对象配置，返回上一层处理流程。
# 这一行使用的名称来自当前脚本的参数、前面设置的变量或运行环境
# 这一段提供了配置云端静态页面、API 与 WebSocket 反向代理所需的定义和处理逻辑，结果交由调用方或运行环境使用。
