# 原生 Nginx:静态前端 + 经本机 SSH 反向隧道转发到工控机后端。
# 前端构建产物放在 /opt/line-twin/deploy/dist/。
# 工控机建立: ssh -N -R 127.0.0.1:3300:127.0.0.1:3000 user@cloud

upstream ipc_backend {
# 打开 upstream 配置块。
    server 127.0.0.1:3300;
    # 设置 Nginx 指令 server。
    keepalive 16;
    # 设置 Nginx 指令 keepalive。
}
# 结束当前配置块。

server {
# 打开 server 配置块。
    listen 8081;
    # 设置 Nginx 指令 listen。
    server_name _;
    # 设置 Nginx 指令 server_name。

    root /opt/line-twin/deploy/dist;
    # 设置 Nginx 指令 root。
    index index.html;
    # 设置 Nginx 指令 index。
    server_tokens off;
    # 设置 Nginx 指令 server_tokens。

    location /assets/ {
    # 打开 location 配置块。
        try_files $uri =404;
        # 设置 Nginx 指令 try_files。
    }
    # 结束当前配置块。

    location ~ /\. {
    # 打开 location 配置块。
        deny all;
        # 设置 Nginx 指令 deny。
        access_log off;
        # 设置 Nginx 指令 access_log。
    }
    # 结束当前配置块。

    location / {
    # 打开 location 配置块。
        try_files $uri $uri/ /index.html;
        # 设置 Nginx 指令 try_files。
    }
    # 结束当前配置块。

    # 机器令牌通道只供工控机本机调用，不经公网代理。
    location ^~ /api/machine/ {
    # 打开 location 配置块。
        return 403;
        # 用 Nginx 的 return 指令立即返回 HTTP 403，拒绝公网访问机器令牌通道。
    }
    # 结束当前配置块。

    location /api/ {
    # 打开 location 配置块。
        proxy_pass http://ipc_backend;
        # 设置 Nginx 指令 proxy_pass。
        proxy_set_header Host $host;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_set_header X-Real-IP $remote_addr;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_read_timeout 30s;
        # 设置 Nginx 指令 proxy_read_timeout。
    }
    # 结束当前配置块。

    location /socket.io/ {
    # 打开 location 配置块。
        proxy_pass http://ipc_backend;
        # 设置 Nginx 指令 proxy_pass。
        proxy_http_version 1.1;
        # 设置 Nginx 指令 proxy_http_version。
        proxy_set_header Upgrade $http_upgrade;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_set_header Connection "upgrade";
        # 设置 Nginx 指令 proxy_set_header。
        proxy_set_header Host $host;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置 Nginx 指令 proxy_set_header。
        proxy_read_timeout 3600s;
        # 设置 Nginx 指令 proxy_read_timeout。
        proxy_send_timeout 3600s;
        # 设置 Nginx 指令 proxy_send_timeout。
    }
    # 结束当前配置块。
}
# 结束当前配置块。
