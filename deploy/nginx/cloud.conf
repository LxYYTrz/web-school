# 云服务器 Nginx:静态前端 + 纯转发(/api 与 /socket.io 经 SSH 隧道到工控机)
#
# 数据路径:
#   浏览器 http://云服务器/           → 本 conf 的静态 dist/
#   浏览器 http://云服务器/api/...    → 172.18.0.1:3300(SSH 反向隧道,容器可达的宿主地址)→ 工控机 NestJS
#   浏览器 http://云服务器/socket.io/ → 172.18.0.1:3300(同上,WebSocket 升级)
#
# 【数据路径总览】
#   浏览器 http://云服务器/           → 本 conf 的静态 dist/
#   浏览器 http://云服务器/api/...    → 172.18.0.1:3300(SSH 反向隧道)→ 工控机 NestJS
#   浏览器 http://云服务器/socket.io/ → 172.18.0.1:3300(同上,WebSocket 升级)
#
# 【★ 隧道由工控机主动建立（见 docs/deployment.md 与 scripts/tunnel-keepalive.ps1）】
#   ssh -N -R 172.18.0.1:3300:127.0.0.1:3000 user@云服务器
#     -R 172.18.0.1:3300:127.0.0.1:3000  云服务器的 3300 端口 → 工控机的后端 3000 端口
#                              （这就是下面 upstream 指向 172.18.0.1:3300 的原因）
#   ⚠️ 隧道必须绑定 172.18.0.1,不能是 127.0.0.1:
#      nginx 跑在容器里,容器内的 127.0.0.1 是容器自己,连不到宿主机的 ssh -R 监听。
#      172.18.0.1 是云端宿主机的 docker0 网关地址,容器可达。
#      写成 127.0.0.1:3300 的后果:公网 /api 全部 502(nginx 连不上上游)。
#      配套要求：云端 sshd 设 GatewayPorts clientspecified。
#      线上实测用的就是这个值（2026-10-23 验证公网 /api 正常）。
#   ★ 数据库在工控机本地(2026-10-23 起),云端不存数据,所以**不需要**数据库方向的转发
#     （原 `-L 5432:127.0.0.1:5432` 隧道已随云端数据库下线一并删除）。
#
# 本文件与线上保持一致(2026-10-23 校对);改完记得:
#   docker exec lt-cloud-nginx nginx -t && docker exec lt-cloud-nginx nginx -s reload

# ---------------------------------------------------------------------------
# upstream：定义后端上游
#   Nginx 会把请求轮询/复用发到这里的 server 172.18.0.1:3300。
#   keepalive 16 = 与上游保持 16 条长连接，减少 TCP 握手开销。
# ---------------------------------------------------------------------------
upstream ipc_backend {
    server 172.18.0.1:3300;      # SSH 反向隧道的云端入口(宿主 docker0 网关)
    # ★ 必须是 172.18.0.1（云端宿主机的 docker 网桥），不能写 127.0.0.1：
    #   Nginx 在容器里，容器的 127.0.0.1 是它自己，够不到宿主机上的隧道 → 全站 502。
    keepalive 16;
}

server {
    listen 80;
    server_name _;                # 有域名后改为实际域名

    root /usr/share/nginx/html;   # 前端 dist(由 compose 挂载)
    index index.html;

    server_tokens off;

    # 静态资源:不存在就 404,绝不能回退到 index.html
    # (否则浏览器缓存的 index.html 会去请求已删除的 js,拿到 HTML 冒充 JS → 白屏)
    location /assets/ {
        try_files $uri =404;
    }

    # 隐藏文件 / 敏感文件一律 404,别把 SPA 首页回退给扫描器
    # (公网 80 端口裸露,每天有机器人扫 /.env /.git/config)
    location ~ /\. {
        deny all;
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → 工控机后端
    location /api/ {
        proxy_pass http://ipc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WebSocket(socket.io)→ 工控机后端;必须带升级头,长连接超时放宽
    location /socket.io/ {
        proxy_pass http://ipc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTPS 时:listen 443 ssl + 证书,并把 80 跳转 443
}
