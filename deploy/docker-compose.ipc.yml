# =============================================================
# 工控机(Windows,高配)侧基础设施
# 角色:全部数据处理 —— EMQX + Redis + MinIO
# 后端 NestJS(server/)与采集器(edge/)在 Windows 上原生运行,不进容器
#
# 用法(工控机上装了 Docker Desktop 时):
#   docker compose -f deploy/docker-compose.ipc.yml up -d
# 没装 Docker 就装原生版本:EMQX Windows 版 / Redis(可用 Memurai)/ MinIO 单文件,
# 端口保持一致即可,后端代码无感知。
#
# 端口全部只绑回环口:本机后端使用,不对局域网/公网开放。
# =============================================================
services:
  emqx:
    image: emqx/emqx:5.8
    container_name: lt-ipc-emqx
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # MQTT(本机采集器 + 本机后端)
      - "127.0.0.1:18083:18083" # Dashboard(仅本机调试)
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123   # TODO 修改
      EMQX_ALLOW_ANONYMOUS: "true"                  # TODO 产线稳定后改 false
    volumes:
      - emqx-data:/opt/emqx/data

  redis:
    image: redis:7-alpine
    container_name: lt-ipc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: lt-ipc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123           # TODO 修改
    ports:
      - "127.0.0.1:9000:9000"   # S3 API(仅本机后端访问)
      - "127.0.0.1:9001:9001"   # Console(仅本机调试)
    volumes:
      - minio-data:/data

volumes:
  emqx-data:
  redis-data:
  minio-data:
